<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uiverse Glass Card</title>
  <style>
    /* From Uiverse.io by kamehame-ha */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      background: #151320;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
    }

    .card {
      width: 300px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 30px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card h2 {
      font-size: 1.8em;
      margin: 0 0 15px 0;
    }

    .card p {
      font-size: 1em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Join Drone Pilot Training</h2>
    <p>DGCA Certified | Apply Now<br>₹35,000 Only</p>
  </div>
</body>
</html>
